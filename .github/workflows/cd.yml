name: CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  deploy_backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          
      - name: Configure Docker
        run: gcloud auth configure-docker
        
      - name: Build and Push Docker image
        run: |
          cd backend
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/reel-ai-backend:${{ github.ref_name }} .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/reel-ai-backend:${{ github.ref_name }}
          
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy reel-ai-backend \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/reel-ai-backend:${{ github.ref_name }} \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated

  deploy_firebase:
    name: Deploy Firebase
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install Firebase Tools
        run: npm install -g firebase-tools
        
      - name: Deploy Firebase Rules
        run: |
          firebase deploy --only firestore:rules,storage:rules --token ${{ secrets.FIREBASE_TOKEN }}
          
      - name: Deploy Firebase Functions
        run: |
          cd functions
          npm install
          firebase deploy --only functions --token ${{ secrets.FIREBASE_TOKEN }}

  deploy_app:
    name: Deploy Flutter App
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Build Android App
        run: flutter build apk --release
        
      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          
      - name: Deploy to Play Store
        run: |
          cd android
          bundle install
          bundle exec fastlane deploy
        env:
          PLAY_STORE_CONFIG_JSON: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
          
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          file: build/app/outputs/flutter-apk/app-release.apk
          groups: testers 