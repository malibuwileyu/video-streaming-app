name: reel_ai
description: An AI-powered educational video platform for content creators.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  firebase_storage: ^11.5.6
  cloud_firestore: ^4.13.6
  # State Management
  flutter_riverpod: ^2.4.9
  # Environment Variables
  flutter_dotenv: ^5.1.0
  # Video Player
  video_player: ^2.8.1
  # Secure Storage
  flutter_secure_storage: ^9.0.0
  # Voice Commands
  speech_to_text: ^6.5.1
  # HTTP Client
  dio: ^5.4.0
  # Utilities
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  logger: ^2.0.2+1
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Testing
  mockito: ^5.4.4
  # Code Generation
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  # Linting
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.production
    - .env.staging
    - assets/images/
    - assets/icons/ 